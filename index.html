<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제목 없는 알피지 시세 리스트</title>
    <!-- Pretendard 폰트 및 FontAwesome 아이콘 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #04060a;
            --card-bg: rgba(13, 19, 33, 0.75);
            --border-neon: rgba(56, 189, 248, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-cyan: #00f0ff;
            --neon-purple: #a855f7;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 배후 네온 그래디언트 오라 효과 */
        .ambient-glow {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        .glow-1 { top: -10%; left: -10%; background: var(--neon-cyan); }
        .glow-2 { bottom: -10%; right: -10%; background: var(--neon-purple); animation-delay: -6s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        /* 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: rgba(4, 6, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .logo i {
            -webkit-text-fill-color: var(--neon-cyan);
            font-size: 1.5rem;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: rgba(13, 19, 33, 0.9);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
            color: #04060a;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        .main-container {
            max-width: 1280px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* 홈 화면 히어로 */
        .home-hero {
            text-align: center;
            padding: 6.5rem 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            border-radius: 28px;
            backdrop-filter: blur(16px);
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .home-hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1.2rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.8rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
            color: #04060a;
            border: none;
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
        }

        /* 검색 & 필터 바 */
        .controls-bar {
            display: flex;
            gap: 18px;
            margin-bottom: 2.5rem;
        }

        .search-box, .filter-box select {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            color: var(--text-main);
            padding: 16px 22px;
            font-size: 1.05rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-box:focus-within, .filter-box select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 1.05rem;
        }

        .filter-box select {
            outline: none;
            cursor: pointer;
        }

        /* 네온 게이밍 카드 그리드 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .item-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
            background: rgba(18, 26, 46, 0.85);
        }

        .item-card img {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            object-fit: cover;
            background: rgba(4, 6, 10, 0.8);
            border: 1px solid var(--border-subtle);
            margin-bottom: 4px;
        }

        .item-card .name {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .item-card .value {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 14px;
            margin-top: 4px;
        }

        .trend-up { color: var(--success-color); font-weight: 800; }
        .trend-down { color: var(--danger-color); font-weight: 800; }
        .trend-stable { color: var(--text-muted); font-weight: 700; }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 6rem;
            font-size: 1.2rem;
        }

        /* 거래 계산기 */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 280px 1fr;
            gap: 28px;
            align-items: start;
        }

        @media(max-width: 1000px) {
            .calc-grid { grid-template-columns: 1fr; }
        }

        .calc-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .calc-panel h3 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
        }

        /* 순수 강방 입력 박스 스타일 */
        .gangbang-input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(4, 6, 10, 0.6);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-neon);
        }

        .gangbang-input-box label {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--neon-cyan);
            white-space: nowrap;
        }

        .gangbang-input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            text-align: right;
        }

        .selected-items {
            min-height: 180px;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-notice {
            color: var(--text-muted);
            text-align: center;
            margin: auto;
            font-size: 1rem;
        }

        .selected-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(4, 6, 10, 0.7);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            font-size: 0.95rem;
            gap: 10px;
        }

        .selected-item-card .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-controls button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-main);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-controls button:hover {
            background: var(--neon-cyan);
            color: #04060a;
        }

        .selected-item-card .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .selected-item-card .delete-btn:hover {
            transform: scale(1.3);
        }

        .total-value {
            font-size: 1.4rem;
            font-weight: 900;
            text-align: right;
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
        }

        .add-item-btn {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .add-item-btn:hover {
            background-color: var(--neon-cyan);
            color: #04060a;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        .calc-result-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .result-badge {
            font-size: 2rem;
            font-weight: 900;
            padding: 14px 28px;
            border-radius: 16px;
            letter-spacing: 2px;
        }

        .result-win { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--success-color); box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        .result-lose { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--danger-color); box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }
        .result-fair { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid var(--warning-color); box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); }

        .diff-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .notice-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.4;
        }

        /* 모달창 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 6, 10, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.open { display: flex; }

        .modal-content {
            background-color: #0b0f19;
            border: 1px solid var(--border-neon);
            border-radius: 28px;
            width: 90%;
            max-width: 560px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 30px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: var(--text-main); }

        .modal-search { padding: 22px 30px 12px; }
        .modal-search input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px 20px;
            color: var(--text-main);
            outline: none;
            font-size: 1.05rem;
        }

        .modal-search input:focus {
            border-color: var(--neon-cyan);
        }

        .modal-items-list {
            overflow-y: auto;
            padding: 12px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-dark);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-item-row:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.05);
            transform: translateX(6px);
        }
    </style>
    <!-- Discord Open Graph Embed -->
    <meta property="og:title" content="제목 없는 알피지 시세 리스트">
    <meta property="og:description" content="로블록스 제목 없는 알피지의 아이템 시세표와 거래 계산기">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://discord-team-dawn.github.io/UNTITLED-RPG-VALUE-LIST/">
    <meta property="og:site_name" content="제목 없는 알피지 시세 리스트">
    <meta property="og:image" content="https://discord-team-dawn.github.io/UNTITLED-RPG-VALUE-LIST/Logo.png">
    <meta property="og:image:alt" content="제목 없는 알피지 시세 리스트">
    <meta name="theme-color" content="#00F0FF">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>제목 없는 알피지 시세 리스트</span>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="home"><i class="fa-solid fa-house"></i> 홈</button>
            <button class="tab-btn" data-tab="values"><i class="fa-solid fa-chart-line"></i> 시세 보기</button>
            <button class="tab-btn" data-tab="calculator"><i class="fa-solid fa-calculator"></i> 거래 계산기</button>
        </nav>
    </header>

    <main class="main-container">
        <!-- 홈 화면 -->
        <section id="home-tab" class="tab-content active">
            <div class="home-hero">
                <h1>제목 없는 알피지 시세 리스트</h1>
                <p>로블록스 제목없는 알피지의 시세 확인과 공정한 거래 계산기를 지금 바로 이용해보세요.</p>
                <div class="hero-btns">
                    <button class="action-btn" onclick="switchTab('values')"><i class="fa-solid fa-list"></i> 시세표 보러가기</button>
                    <button class="action-btn" style="background: linear-gradient(135deg, var(--neon-purple), #7c3aed);" onclick="switchTab('calculator')"><i class="fa-solid fa-calculator"></i> 거래 계산기 쓰기</button>
                </div>
            </div>
        </section>

        <!-- 시세 보기 (카드 그리드) -->
        <section id="values-tab" class="tab-content">
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                    <input type="text" id="searchInput" placeholder="아이템 이름 검색...">
                </div>
                <div class="filter-box">
                    <select id="categoryFilter">
                        <option value="all">모든 카테고리</option>
                        <option value="Weapon">무기 (Weapon)</option>
                        <option value="Armor">방어구 (Armor)</option>
                        <option value="Accessory">장신구 (Accessory)</option>
                        <option value="Item">기타 (Item)</option>
                    </select>
                </div>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="loading-text">데이터를 불러오는 중입니다...</div>
            </div>
        </section>

        <!-- 거래 계산기 -->
        <section id="calculator-tab" class="tab-content">
            <div class="calc-grid">
                <!-- 내 제안 -->
                <div class="calc-panel">
                    <h3><i class="fa-solid fa-user" style="color: var(--neon-cyan);"></i> 내 제안 (Your Offer)</h3>
                    
                    <!-- 순수 강방 직접 입력 칸 -->
                    <div class="gangbang-input-box">
                        <label><i class="fa-solid fa-coins"></i> 추가 강방:</label>
                        <input type="number" id="myGangbangInput" min="0" placeholder="0" oninput="calculateTrade()">
                    </div>

                    <div class="selected-items" id="myOffers">
                        <p class="empty-notice">아이템을 선택하세요</p>
                    </div>
                    <div class="total-value">총 가치: <span id="myTotal">0</span> 강방</div>
                    <button class="add-item-btn" onclick="openItemSelector('my')"><i class="fa-solid fa-plus"></i> 아이템 추가</button>
                </div>

                <!-- 거래 결과 판정 패널 -->
                <div class="calc-result-panel">
                    <div class="result-badge" id="tradeResultBadge">적정 (FAIR)</div>
                    <div class="diff-text" id="tradeDiff">차액: 0 강방</div>
                    <div class="notice-text">※ 시세가 범위 형태(예: 1~50)인 아이템은 <b>가장 높은 가격(최댓값)</b>을 기준으로 계산됩니다.</div>
                </div>

                <!-- 상대방 제안 -->
                <div class="calc-panel">
                    <h3><i class="fa-solid fa-users" style="color: var(--neon-purple);"></i> 상대방 제안 (Their Offer)</h3>
                    
                    <!-- 순수 강방 직접 입력 칸 -->
                    <div class="gangbang-input-box">
                        <label><i class="fa-solid fa-coins"></i> 추가 강방:</label>
                        <input type="number" id="theirGangbangInput" min="0" placeholder="0" oninput="calculateTrade()">
                    </div>

                    <div class="selected-items" id="theirOffers">
                        <p class="empty-notice">아이템을 선택하세요</p>
                    </div>
                    <div class="total-value">총 가치: <span id="theirTotal">0</span> 강방</div>
                    <button class="add-item-btn" onclick="openItemSelector('their')"><i class="fa-solid fa-plus"></i> 아이템 추가</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 아이템 선택 모달 -->
    <div class="modal" id="itemSelectorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>아이템 선택</h3>
                <button class="close-btn" onclick="closeItemSelector()">&times;</button>
            </div>
            <div class="modal-search">
                <input type="text" id="modalSearchInput" placeholder="검색..." oninput="filterModalItems()">
            </div>
            <div class="modal-items-list" id="modalItemsList"></div>
        </div>
    </div>

    <script>
        // ==================== [설정] Supabase 연결 정보 ====================
        const SUPABASE_URL = 'https://dpmcquiuhgcxxuqorbkq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbWNxdWl1aGdjeHh1cW9yYmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTMxMDYsImV4cCI6MjEwNzM2OTEwNn0.Tl8R0QFfWAn095xRCGNvntMnlWvAB7SN_z2TVUADz0g';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let itemsData = [];
        let myOfferList = []; 
        let theirOfferList = []; 
        let currentTargetSide = 'my';

        // 탭 전환
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        function switchTab(tabName) {
            tabBtns.forEach(b => {
                if (b.dataset.tab === tabName) b.classList.add('active');
                else b.classList.remove('active');
            });
            tabContents.forEach(c => {
                if (c.id === `${tabName}-tab`) c.classList.add('active');
                else c.classList.remove('active');
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        // Supabase에서 데이터 가져오기
        async function fetchItems() {
            try {
                const { data, error } = await supabaseClient
                    .from('items')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;
                itemsData = data || [];
                renderCards(itemsData);
            } catch (err) {
                console.error('데이터 로드 실패:', err);
                document.getElementById('cardsGrid').innerHTML = `
                    <div class="loading-text" style="color: var(--danger-color);">데이터 로드 실패. Supabase 테이블 설정을 확인해주세요.</div>
                `;
            }
        }

        // DB 변경 감지 동기화
        function setupRealtimeSync() {
            supabaseClient
                .channel('public:items')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, payload => {
                    fetchItems();
                })
                .subscribe();
        }

        // 가치 파싱 핵심 함수 (콜론 비율 파싱 + 범위형태일 경우 최댓값 추출)
        function parseItemRatio(item) {
            let qty = 1;
            let val = 0;
            let rawText = "";

            const rawValue = item.value;

            if (typeof rawValue === 'string' && rawValue.includes(':')) {
                const parts = rawValue.split(':');
                qty = parseFloat(parts[0].trim()) || 1;
                
                const valPart = parts[1].trim();
                rawText = `${qty}개 : ${valPart} 강방`;

                if (valPart.includes('~')) {
                    const range = valPart.split('~');
                    const minVal = parseFloat(range[0].trim()) || 0;
                    const maxVal = parseFloat(range[1].trim()) || 0;
                    val = Math.max(minVal, maxVal); // 가장 높은 가격(최댓값) 기준 적용
                } else {
                    val = parseFloat(valPart) || 0;
                }
            } else {
                qty = item.quantity !== undefined ? parseFloat(item.quantity) : 1;
                val = parseFloat(rawValue) || 0;
                rawText = `${qty}개 : ${val.toLocaleString()} 강방`;
            }

            return { qty, val, rawText };
        }

        // 카드 그리드 렌더링
        function renderCards(data) {
            const grid = document.getElementById('cardsGrid');
            if (data.length === 0) {
                grid.innerHTML = `<div class="loading-text">등록된 아이템이 없습니다.</div>`;
                return;
            }

            grid.innerHTML = data.map(item => {
                const parsed = parseItemRatio(item);

                return `
                    <div class="item-card">
                        <img src="${item.image_url || 'https://via.placeholder.com/96'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/96'">
                        <div class="name">${item.name}</div>
                        <div class="value">${parsed.rawText}</div>
                        <div class="meta-row">
                            <span>${item.category || 'Item'}</span>
                            <span class="${getTrendClass(item.trend)}">${getTrendIcon(item.trend)} ${item.trend || '보통'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getTrendClass(trend) {
            if (trend === 'Rising' || trend === '상승') return 'trend-up';
            if (trend === 'Falling' || trend === '하락') return 'trend-down';
            return 'trend-stable';
        }
        function getTrendIcon(trend) {
            if (trend === 'Rising' || trend === '상승') return '▲';
            if (trend === 'Falling' || trend === '하락') return '▼';
            return '-';
        }

        document.getElementById('searchInput').addEventListener('input', filterCards);
        document.getElementById('categoryFilter').addEventListener('change', filterCards);

        function filterCards() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const filtered = itemsData.filter(item => {
                return item.name.toLowerCase().includes(keyword) && (category === 'all' || item.category === category);
            });
            renderCards(filtered);
        }

        // 거래 계산기 모달 로직
        function openItemSelector(side) {
            currentTargetSide = side;
            document.getElementById('modalSearchInput').value = '';
            renderModalItems(itemsData);
            document.getElementById('itemSelectorModal').classList.add('open');
        }

        function closeItemSelector() {
            document.getElementById('itemSelectorModal').classList.remove('open');
        }

        function renderModalItems(list) {
            const container = document.getElementById('modalItemsList');
            container.innerHTML = list.map(item => {
                const parsed = parseItemRatio(item);
                return `
                    <div class="modal-item-row" onclick="addItemToCalc('${item.id}')">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <img src="${item.image_url || 'https://via.placeholder.com/36'}" width="36" height="36" style="border-radius: 8px;" onerror="this.src='https://via.placeholder.com/36'">
                            <span><b>${item.name}</b></span>
                        </div>
                        <span style="color:var(--neon-cyan); font-weight: bold;">${parsed.rawText}</span>
                    </div>
                `;
            }).join('');
        }

        function filterModalItems() {
            const keyword = document.getElementById('modalSearchInput').value.toLowerCase();
            const filtered = itemsData.filter(item => item.name.toLowerCase().includes(keyword));
            renderModalItems(filtered);
        }

        function addItemToCalc(itemId) {
            const item = itemsData.find(i => i.id == itemId);
            if (!item) return;

            const list = currentTargetSide === 'my' ? myOfferList : theirOfferList;
            const existing = list.find(entry => entry.item.id == itemId);
            if (existing) {
                existing.quantity += 1;
            } else {
                list.push({ item: item, quantity: 1 });
            }

            renderOffers(currentTargetSide);
            closeItemSelector();
            calculateTrade();
        }

        function updateQuantity(side, index, delta) {
            const list = side === 'my' ? myOfferList : theirOfferList;
            list[index].quantity += delta;
            if (list[index].quantity <= 0) {
                list.splice(index, 1);
            }
            renderOffers(side);
            calculateTrade();
        }

        function removeItemFromCalc(side, index) {
            if (side === 'my') {
                myOfferList.splice(index, 1);
                renderOffers('my');
            } else {
                theirOfferList.splice(index, 1);
                renderOffers('their');
            }
            calculateTrade();
        }

        function renderOffers(side) {
            const container = document.getElementById(side === 'my' ? 'myOffers' : 'theirOffers');
            const list = side === 'my' ? myOfferList : theirOfferList;

            if (list.length === 0) {
                container.innerHTML = `<p class="empty-notice">아이템을 선택하세요</p>`;
            } else {
                container.innerHTML = list.map((entry, idx) => {
                    const parsed = parseItemRatio(entry.item);
                    
                    const calculatedSubTotal = Math.round((entry.quantity * parsed.val) / parsed.qty);

                    return `
                        <div class="selected-item-card">
                            <div class="item-info">
                                <span><b>${entry.item.name}</b></span>
                                <span style="font-size: 0.85rem; color: var(--neon-cyan);">${calculatedSubTotal.toLocaleString()} 강방 <span style="color:var(--text-muted)">(기준 ${parsed.rawText})</span></span>
                            </div>
                            <div class="qty-controls">
                                <button onclick="updateQuantity('${side}', ${idx}, -1)">-</button>
                                <span style="font-weight: bold; min-width: 20px; text-align: center;">${entry.quantity}개</span>
                                <button onclick="updateQuantity('${side}', ${idx}, 1)">+</button>
                            </div>
                            <button class="delete-btn" onclick="removeItemFromCalc('${side}', ${idx})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }).join('');
            }
            calculateTrade();
        }

        function calculateTrade() {
            const calculateListTotal = (list) => {
                return list.reduce((sum, entry) => {
                    const parsed = parseItemRatio(entry.item);
                    return sum + Math.round((entry.quantity * parsed.val) / parsed.qty);
                }, 0);
            };

            // 순수 강방 입력값 반영
            const myExtraGangbang = parseFloat(document.getElementById('myGangbangInput').value) || 0;
            const theirExtraGangbang = parseFloat(document.getElementById('theirGangbangInput').value) || 0;

            const myTotal = calculateListTotal(myOfferList) + myExtraGangbang;
            const theirTotal = calculateListTotal(theirOfferList) + theirExtraGangbang;

            document.getElementById('myTotal').textContent = myTotal.toLocaleString();
            document.getElementById('theirTotal').textContent = theirTotal.toLocaleString();

            const badge = document.getElementById('tradeResultBadge');
            const diffText = document.getElementById('tradeDiff');
            const diff = theirTotal - myTotal;

            if (myOfferList.length === 0 && theirOfferList.length === 0 && myExtraGangbang === 0 && theirExtraGangbang === 0) {
                badge.textContent = '적정 (FAIR)';
                badge.className = 'result-badge result-fair';
                diffText.textContent = '차액: 0 강방';
                return;
            }

            const threshold = (myTotal + theirTotal) * 0.05;
            if (Math.abs(diff) <= threshold) {
                badge.textContent = '적정 (FAIR)';
                badge.className = 'result-badge result-fair';
                diffText.textContent = `동등한 거래 (차액: ${Math.abs(diff).toLocaleString()} 강방)`;
            } else if (diff > 0) {
                badge.textContent = '이득 (WIN)';
                badge.className = 'result-badge result-win';
                diffText.textContent = `이득! (+${diff.toLocaleString()} 강방)`;
            } else {
                badge.textContent = '손해 (LOSE)';
                badge.className = 'result-badge result-lose';
                diffText.textContent = `손해! (${diff.toLocaleString()} 강방)`;
            }
        }

        // 초기 실행
        fetchItems();
        setupRealtimeSync();
    </script>
</body>
</html>
